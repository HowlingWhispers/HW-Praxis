<!doctype html>
<html lang="en" style="background:#0c0e12">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e12" />
    <title>Praxis</title>
  </head>
  <body>
    <div id="root">
      <p id="boot" style="font:16px/1.5 system-ui,sans-serif;color:#8d96a5;padding:24px">Loading Praxis…</p>
    </div>
    <script>
      // If the app fails before it can draw, say why instead of showing a blank page.
      window.addEventListener('error', function (event) {
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.style.color = '#e58a7f';
        boot.textContent = 'Praxis could not start: ' + (event.message || 'a script failed to load') + (event.filename ? ' (' + event.filename + ')' : '');
      }, true);
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (boot && boot.textContent === 'Loading Praxis…') boot.textContent = 'Praxis is taking a long time to start. If this stays, the app script did not load.';
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
